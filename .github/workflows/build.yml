name: Build on Push

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: List files
        run: ls -R

      - name: Build with Maven
        run: mvn clean install -DskipTests
        working-directory: fcs-interview-code-assignment-main/java-assignment


      - name: Run tests
        run: mvn test
        working-directory: fcs-interview-code-assignment-main/java-assignment

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app
          path: target/*.jar
