%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.username=warehouse_user
%test.quarkus.datasource.password=warehouse_pwd
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/warehouse_db
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=2
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.openapi.generator.spec=warehouse-openapi.yaml
quarkus.openapi.generator.base-package=com.warehouse.api
quarkus.datasource.devservices.enabled=false
quarkus.swagger-ui.always-include=true